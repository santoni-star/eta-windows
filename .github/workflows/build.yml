name: Build Eta Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MSI Installer
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install cargo-tauri CLI
        uses: tauri-apps/tauri-action@v0
        with:
          action: install

      - name: Check Rust and Tauri versions
        run: |
          rustc --version
          cargo --version
          cargo tauri --version

      - name: Build Windows MSI
        uses: tauri-apps/tauri-action@v0
        with:
          action: build
          args: --verbose

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eta-Setup
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14

      - name: Get release version
        id: version
        run: |
          $version = (Get-Content src-tauri/Cargo.toml | Select-String "version =").ToString().Split('"')[1]
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
