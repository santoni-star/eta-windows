[package]
name = "eta-windows"
version = "0.1.0"
description = "Eta - System-level AI Assistant for Windows"
edition = "2021"

[dependencies]
tauri = { version = "1.6", features = ["api-all"] }
tauri-build = { version = "1.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json"] }
serde_json_value = "0.1"
directories = "5"
rpassword = "7"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "migrate"] }
winapi = { version = "0.3", features = ["winuser", "winnt", "libloaderapi", "processenv", "synchapi", "shellapi", "ole2", "combaseapi", "shlobj", "msctf", "imm", "oleidl", "mshtml", "msxml", "urlmon", "wincon", "handleapi", "fileapi", "winbase", "winerror", "std"] }
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Input",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_TextServices",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
] }
rdev = "0.7" # global hotkeys
notify = "6" # file watchers
walkdir = "2"
serde_yaml = "0.9"
dotenv = "0.15"

[build-dependencies]
tauri-build = { version = "1.6", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
