[package]
name = "eta-windows"
version = "0.1.0"
description = "Eta - System-level AI Assistant for Windows"
edition = "2021"

[dependencies]
tauri = { version = "1.6", features = ["api-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_yaml = "0.9"

[build-dependencies]
tauri-build = { version = "1.6" }

[profile.release]
opt-level = 3
